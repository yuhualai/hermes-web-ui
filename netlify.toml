[build]
  command = "npm run build"
  publish = "dist/client"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "23"
  HERMES_WEB_UI_HOME = "/tmp/hermes-web-ui"
  HERMES_WEBUI_STATE_DIR = "/tmp/hermes-web-ui"
  UPLOAD_DIR = "/tmp/hermes-web-ui/upload"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200

[[redirects]]
  from = "/upload"
  to = "/.netlify/functions/api/upload"
  status = 200

[[redirects]]
  from = "/webhook"
  to = "/.netlify/functions/api/webhook"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
